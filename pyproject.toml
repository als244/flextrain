[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flextrain"
version = "0.1.0"
description = "Working-set-aware training engine for transformer language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "triton>=3.0",
    "numpy",
    "datasets",
    "pyyaml",
    "safetensors",
    "transformers",
    "accelerate",
]

[project.optional-dependencies]
linear-attention = ["flash-linear-attention", "causal-conv1d"]
# tilelang is required only on Hopper (sm90+) with Triton >= 3.4.0 to
# work around FLA issue #640 (default Triton chunk_bwd_dqkwg has a
# correctness bug under that combination). Harmless on other GPUs;
# linear_attn.py only imports it when the bug condition is detected.
linear-attention-hopper = [
    "flash-linear-attention",
    "causal-conv1d",
    "tilelang",
]
flash-attn = ["flash_attn_interface"]
peft = ["peft"]

[tool.setuptools.packages.find]
include = ["flextrain*"]
exclude = ["orig*", "tests*", "docs*", "datasets*", "models*", "runs*", "parity_results*", "helpers*"]
