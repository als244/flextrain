[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flextrain"
version = "0.1.0"
description = "Working-set-aware training engine for transformer language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "triton>=3.0",
    "numpy",
    "packaging",
    "datasets",
    "pyyaml",
    "safetensors",
    "transformers",
    "accelerate",
    # Linear-attention path (Qwen3-Next, Qwen3.5 hybrid layers use
    # Gated DeltaNet via FLA). Default-installed so those archs work
    # out of the box.
    "flash-linear-attention",
]

[project.scripts]
# One-time post-install: fetch prebuilt flash-attn and causal-conv1d
# wheels matched to the local (python, torch, cuda, compute-cap) tuple.
# Modern pip default-isolates the build env for editable installs, so
# wheel installs cannot be run from setup.py — the user runs this once
# after `pip install -e .` and gets both libraries via pre-built wheels
# (no source compile). See helpers/install_flash_attn_wheels.py and
# helpers/install_causal_conv1d_wheel.py for the underlying logic.
flextrain-post-install = "flextrain.scripts.post_install:main"

[project.optional-dependencies]
# tilelang is required only on Hopper (sm90+) with Triton >= 3.4.0 to
# work around FLA issue #640 (default Triton chunk_bwd_dqkwg has a
# correctness bug under that combination). Harmless on other GPUs;
# linear_attn.py only imports it when the bug condition is detected.
hopper = ["tilelang"]
peft = ["peft"]
# flash-attention 2 (and flash-attention 3 on Hopper) is fetched as
# prebuilt wheels by setup.py during ``pip install -e .`` — see
# ``helpers/install_flash_attn_wheels.py``. The ``flash-attn-build``
# extra is only for users who want to build flash-attn from source
# (slow; can take 30+ minutes on first install).
flash-attn-build = ["flash_attn_interface"]
# causal-conv1d is fetched the same way — prebuilt wheels from the
# Dao-AILab/causal-conv1d GitHub releases via
# ``helpers/install_causal_conv1d_wheel.py``. The
# ``causal-conv1d-build`` extra is the source-build escape hatch.
causal-conv1d-build = ["causal-conv1d"]

[tool.setuptools.packages.find]
include = ["flextrain*"]
exclude = ["orig*", "tests*", "docs*", "datasets*", "models*", "runs*", "parity_results*", "helpers*"]
